[project]
name = "stremio-dl"
version = "0.1.0"
description = "Download movies and TV shows through Stremio addons (Cinemeta + Torrentio) over BitTorrent."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "questionary>=2.0",
    "httpx>=0.27",
    "tenacity>=8.2",
    "pydantic>=2.6",
    "platformdirs>=4.2",
    "tomli-w>=1.0",
    "guessit>=3.8",
    "libtorrent>=2.0.9",
]

[project.scripts]
sdl = "stremio_dl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stremio_dl"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "network: hits the live addon APIs (deselect with -m 'not network')",
    "torrent: runs local libtorrent sessions",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
